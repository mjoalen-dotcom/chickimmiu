name: Scheduled Cron

# 保護：所有 job 需要 repo Settings → Secrets → CRON_SECRET 已設，
# prod server 的 .env 也要用相同值，否則 endpoint 回 401/503。
#
# 時區：GitHub cron 用 UTC。TPE = UTC+8。
#   - */10 * * * *      每 10 分鐘（automation + segments + auto-cancel-orders）
#   - */30 * * * *      每 30 分鐘（retry-invoices，發票 48h 時限）
#   - 0 3 * * *         每日 03:00 UTC = TPE 11:00（expire-points + expire-subscriptions）
#   - 0 16 * * *        每日 16:00 UTC = TPE 00:00（streak-decay，day rollover）
#
# ⚠️ GitHub Actions 停權期間 prod crontab 有同名 fallback（tag [ckmu-outage-cron]）；
#    恢復切回本 workflow 前，先確認這裡的 job 清單 ⊇ crontab 清單，再刪 crontab 行。

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '*/30 * * * *'
    - cron: '0 3 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

# 避免同一 workflow 多份 run 堆疊（如果前一輪 10min 還沒跑完）
concurrency:
  group: cron-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

env:
  TARGET_HOST: https://pre.chickimmiu.com

jobs:
  automations:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run automations cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${TARGET_HOST}/api/cron/automations"
      - name: Run segments cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${TARGET_HOST}/api/cron/segments"
      - name: Run apply-product-schedules cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${TARGET_HOST}/api/cron/apply-product-schedules"
      - name: Run auto-cancel-orders cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${TARGET_HOST}/api/cron/auto-cancel-orders"

  retry-invoices:
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run retry-invoices cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${TARGET_HOST}/api/cron/retry-invoices"

  expire-points:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run expire-points cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${TARGET_HOST}/api/cron/expire-points"
      - name: Run birthday scheduler cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${TARGET_HOST}/api/cron/birthday"
      - name: Run expire-card-battles cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${TARGET_HOST}/api/cron/expire-card-battles"
      - name: Run expire-wishes cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${TARGET_HOST}/api/cron/expire-wishes"
      - name: Run expire-subscriptions cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${TARGET_HOST}/api/cron/expire-subscriptions"

  streak-decay:
    if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run streak-decay cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${TARGET_HOST}/api/cron/streak-decay"
      - name: Run settle-style-rooms cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${TARGET_HOST}/api/cron/settle-style-rooms"
      - name: Run leaderboard-settle cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${TARGET_HOST}/api/cron/leaderboard-settle"
      - name: Run preheat-horoscopes cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${TARGET_HOST}/api/cron/preheat-horoscopes"
