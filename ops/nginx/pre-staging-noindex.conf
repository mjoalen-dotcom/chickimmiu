# Staging 防護：pre.chickimmiu.com 全站送出 X-Robots-Tag noindex header。
#
# 與 ckmu-uploads.conf 不同——這份是「站點專屬」規則（只能套在
# pre.chickimmiu.com 的 server block 內），不可放進 /etc/nginx/conf.d/
# （conf.d 是 http 層級全域套用，會連正式站 www.chickimmiu.com /
# ckmu.co 一起 noindex，切換上線那天絕對不能發生這種事）。
#
# 部署方式（手動，deploy-prod.sh 目前只自動同步 conf.d/*.conf，
# 不會自動同步這種站點專屬 snippet）：
#   1. 複製本檔至 /etc/nginx/snippets/pre-staging-noindex.conf
#   2. 在 /etc/nginx/sites-enabled/pre.chickimmiu.com 的
#      `server { server_name pre.chickimmiu.com; ... }` block 內加一行：
#        include /etc/nginx/snippets/pre-staging-noindex.conf;
#   3. nginx -t 驗證通過後 systemctl reload nginx
#
# 正式切換 www 當天（CKMU-CUTOVER-000.md §4 第8項）：這個 include
# 必須從 pre.chickimmiu.com 的 server block 移除，否則正式站會帶著
# noindex 上線，Google 永遠不收錄——這是切換清單裡明確標注的高風險項。
add_header X-Robots-Tag "noindex, nofollow" always;
