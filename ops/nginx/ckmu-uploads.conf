# Auto-managed by deploy-prod.sh — drop into /etc/nginx/conf.d/ on prod box.
#
# nginx 預設 client_max_body_size 1M，會把 admin 後台的 CSV/XLSX 匯入退 413
# （Users / Products / Shopline 全會員匯入動輒 5-15MB）。
# 這份 snippet 把上限提到 50MB，與 importExport.ts 內 server-side guard 對齊。
#
# 50MB 是兩端共識上限：
#   - importExport.ts MAX_BYTES = 50 * 1024 * 1024
#   - 前端 admin GUI 給超過 50MB 的檔上傳，server-side 直接 413 + 友善訊息
#   - 之後若需要更大（例如商品圖批次匯入），同步調整兩處
client_max_body_size 50m;
