# wall.ckmu.co bootstrap virtual host.
#
# Install to /etc/nginx/sites-available/wall.ckmu.co, enable the symlink, then
# run `certbot --nginx -d wall.ckmu.co --redirect`. Certbot owns the TLS block;
# this repository keeps the repeatable HTTP bootstrap and reverse-proxy rules.
server {
    listen 80;
    server_name wall.ckmu.co;

    # Public beta remains out of search results until Meta and billing leave
    # sandbox. Remove only after an explicit launch decision.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /_next/static/ {
        alias /var/www/chickimmiu/.next/static/;
    }

    # Keep the product home at the domain root while preserving the existing
    # Next.js /social-wall route tree.
    location = / {
        proxy_pass http://127.0.0.1:3000/social-wall;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
